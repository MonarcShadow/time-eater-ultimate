# Ajustes de "Grieta del Tiempo" que se pueden cambiar a mano.
# Formato: NOMBRE = valor   (lo que va detrás de # es un comentario)
# Después de cambiar un valor: doble clic en RECONSTRUIR_GRIETA.bat (en la carpeta del repo).
# Reconstruye el nivel y lo copia al juego; basta con salir al White Space y volver a entrar al nivel.
# (Equivale a: powershell -ExecutionPolicy Bypass -File scripts\construir_nivel.ps1 -Nivel grieta_del_tiempo
#  y después PROBAR_EN_JUEGO.bat)

# --- Homing attack (solo en este nivel) -----------------------------------------------------------
# Distancia máxima, en metros, a la que Sonic fija un objetivo.
HOMING_ALCANCE_3D = 32      # en 3D. El juego trae 21.1
HOMING_ALCANCE_2D = 20      # en 2D. El juego trae 13.5 (y 18.3 en la otra variante, que se escala igual)

# --- Cámara de los planeos ------------------------------------------------------------------------
# Giro en grados, visto desde arriba, que se suma al rumbo con el que Sonic entra al pozo.
# En el fondo de cada pozo hay una flecha morada que apunta al túnel de salida: el giro es correcto
# cuando, durante el planeo, la flecha apunta hacia ARRIBA en la pantalla. Si apunta a un lado, sumar
# o restar 90; si apunta hacia abajo, sumar 180. El giro es lineal y cíclico: 200 da lo mismo que -160
# o 560, así que basta con probar entre 0 y 359. (Mirar la flecha pasados los 2 primeros segundos del
# planeo: la cámara tarda 2 s en girar desde la vista normal.)
# Al aterrizar, la cámara se pone detrás de Sonic mirando al túnel de salida: si el giro es bueno,
# la salida que se veía delante durante el planeo sigue delante.
GIRO_CAMARA_RELOJ = 180     # planeo de la sección 11 (Dentro del reloj). "Casi ideal" en la prueba de la 0.7.2
GIRO_CAMARA_PLANEO = 180    # planeo final de la sección 12. En prueba (180 se dio por bueno en la 0.7.3)

# --- Cambios entre 3D y 2D ------------------------------------------------------------------------
# Metros sin huecos ni enemigos antes y después de cada cambio de 3D a 2D (y de vuelta), porque un
# homing attack que cruza el cambio se cancela. 40 m son unos 2 s corriendo sin boost.
# Al construir, el nivel avisa (TEU_AVISO margen 2D) de lo que quede dentro de ese margen.
MARGEN_CAMBIO_2D = 40

# --- Cámara de los tramos 2D ----------------------------------------------------------------------
# La cámara 2D por defecto quedaba muy cerca y no se veía el suelo (los niveles originales usan
# 15-20 m). Más DISTANCIA = más lejos; PITCH = grados mirando hacia abajo; ALTURA = metros por encima
# de Sonic a los que apunta. Si la cámara no queda de lado (mira desde atrás o desde delante),
# probar GIRO = 90, -90 o 180.
CAMARA_2D_DISTANCIA = 20
CAMARA_2D_PITCH = 25
CAMARA_2D_ALTURA = -0.5
CAMARA_2D_GIRO = 0

# --- Loop y su cámara (0.7.11) --------------------------------------------------------------------
# Radio, en metros, del loop de la sección 1 (hasta la 0.7.10 era 10). Su bajada lleva directo al 2D.
LOOP_RADIO = 15
# Cámara como la del PRIMER loop de Green Hill. Estos valores la replican exactamente (ObjCameraPan
# 122609 y su volumen 122608 de ghz200): una cámara fija en el eje, a ras de suelo, ADELANTO metros
# antes del centro del volumen, que gira para seguir a Sonic; se ve el loop desde la entrada.
LOOP_CAMARA_ADELANTO = 37   # m de la cámara antes del centro del volumen (aquí, el centro del loop)
LOOP_CAMARA_ALTO = 1        # m sobre el suelo de la cámara y del centro del volumen
LOOP_CAMARA_DISTANCIA = 10
LOOP_CAMARA_FOVY = 45       # campo de visión en grados
# Volumen donde se activa esa cámara (largo en el sentido de la marcha, ancho y alto, en metros).
# El de Green Hill no cubre entero un loop de 30 m de alto que sale 14 m al costado: si la cámara
# vuelve detrás de Sonic en la cima o en la bajada, probar VOL_ALTO = 33 y VOL_ANCHO = 26.
LOOP_CAMARA_VOL_LARGO = 50
LOOP_CAMARA_VOL_ANCHO = 8
LOOP_CAMARA_VOL_ALTO = 14
# Prioridad frente a otras cámaras (Green Hill: 1). Si no se impone a la de detrás de Sonic, subirla
# (en la 0.7.9, con 1, perdía; en la prueba de la 0.7.10 tenías 6).
LOOP_CAMARA_PRIORIDAD = 1
LOOP_CAMARA_EASE = 0.6      # segundos de transición al entrar y al salir

# --- Cámara del riel secreto de la torre del reloj (0.7.10) ----------------------------------------
# Cámara desde arriba y fija, como la del riel de la torre de Rooftop Run (Pitch 85-89, a 4-5 m).
# PITCH = grados mirando hacia abajo (90 = vertical); DISTANCIA = metros hasta Sonic.
RIEL_CAMARA_PITCH = 85
RIEL_CAMARA_DISTANCIA = 8
# Inicio del riel: grados a la izquierda del frente (0 = de frente, 90 = del todo a la izquierda) y
# metros sobre la explanada. El segundo Spinner va en la misma dirección, a 13 m del centro y 4 m
# más bajo que el inicio del riel.
RIEL_SECRETO_ANGULO = 20
RIEL_SECRETO_ALTO = 14

# --- Light speed dash (0.7.10) --------------------------------------------------------------------
# Medidas de Planet Wisp, desafío 4: anillos a ~1,1 m y como mucho ~6° de giro entre dos seguidos
# (con más separación o giros más cerrados Sonic sale recto). HUECO = metros del hueco del desafío
# aéreo de la sección 9 (con 24 se cruzaba con un air boost).
LIGHT_DASH_SEPARACION = 1.1
LIGHT_DASH_GIRO_MAX = 6
LIGHT_DASH_HUECO = 150

# --- Salida (para pruebas) ------------------------------------------------------------------------
# Sección en cuyo checkpoint aparece Sonic al entrar al nivel. 0 = salida original del nivel
# (principio de la sección 1: posición del juego x 2, y 0.1, z 0, Yaw 90; copia en salida_original.txt).
# 11 = antes del planeo del reloj; 12 = antes del planeo final.
# Volver a 0 antes de publicar una versión (el script de publicación no deja publicar con otro valor).
INICIO_SECCION = 0

# --- Gimmicks nuevos (0.7.4) ----------------------------------------------------------------------
# Rampa del borde de los tejados (sección 9): altura en metros y ángulo en grados. El largo sale de
# los dos (a 25° y 0,8 m mide 1,7 m). Más ángulo = sale más alto; más altura = vuela más tiempo.
RAMPA_TEJADO_ALTO = 0.3     # 1.2   (0.7.4) se salía demasiado alto
RAMPA_TEJADO_ANGULO = 3.8     # a 45° (0.7.4) se salía demasiado alto
# 1 = coloca las barras (JumpPole e IronPole), la tirolina (Pulley) y los paneles de salto en pared
# (WallJumpBlock). Si alguno cierra el juego, poner 0 y reconstruir.
GIMMICKS_NUEVOS = 1

# Barra de giro de la sección 3 (homing, girar y saltar): largo, altura sobre la pista y desplazamiento.
# El juego coloca la barra desde un extremo y la alarga hacia la derecha: con LADO = LARGO / 2 queda
# centrada. Si queda corrida a la derecha, subir LADO; si queda a la izquierda, bajarlo.
BARRA_GIRO_LARGO = 30
BARRA_GIRO_ALTO = 5
BARRA_GIRO_LADO = -15
